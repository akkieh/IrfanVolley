<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IrfanVolley v0.2</title>
<style>
html,body{margin:0;background:#87CEEB;overflow:hidden;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
function rs(){c.width=innerWidth;c.height=innerHeight;}rs();onresize=rs;

let state="menu",difficulty="Medium";
const goal=15;

const P={x:0,y:0,r:45,vx:0,vy:0};
const A={x:0,y:0,r:45,vx:0,vy:0};
const B={x:0,y:0,r:18,vx:5,vy:-2};
let sP=0,sA=0,left=false,right=false,jump=false;

const G=()=>c.height-80,N=()=>c.width/2;
function resetBall(dir=1){
 B.x=c.width/2;B.y=140;B.vx=5*dir;B.vy=-2;
 P.x=c.width*0.22;P.y=G();
 A.x=c.width*0.78;A.y=G();
}
resetBall();

function scorePoint(player){
 if(player==="P") sP++; else sA++;
 if((sP>=goal||sA>=goal) && Math.abs(sP-sA)>=2){state="gameover";return;}
 resetBall(player==="P"?1:-1);
}

function collide(pl){
 let dx=B.x-pl.x,dy=B.y-pl.y;
 let d=Math.hypot(dx,dy);
 let m=B.r+pl.r;
 if(d<m){
  let nx=dx/d,ny=dy/d;
  B.x=pl.x+nx*m; B.y=pl.y+ny*m;
  let speed=Math.max(8,Math.hypot(B.vx,B.vy));
  B.vx=nx*speed + pl.vx*0.3;
  B.vy=ny*speed + pl.vy*0.2;
 }
}

function update(){
 if(state!=="play") return;

 if(left) P.vx=-6;
 else if(right) P.vx=6;
 else P.vx*=0.82;

 if(jump && P.y>=G()-1){P.vy=-12;jump=false;}

 P.vy+=0.45; P.x+=P.vx; P.y+=P.vy;
 if(P.y>G()){P.y=G();P.vy=0;}
 P.x=Math.max(P.r,Math.min(N()-20-P.r,P.x));

 let react={Easy:0.8,Medium:1.0,Hard:1.3}[difficulty];
 let target=Math.max(N()+50,Math.min(c.width-60,B.x));
 A.vx=(target>A.x?4:-4)*react;
 if(B.y<A.y-50 && A.y>=G()-1) A.vy=-10*react;

 A.vy+=0.45; A.x+=A.vx; A.y+=A.vy;
 if(A.y>G()){A.y=G();A.vy=0;}

 B.vy+=0.33; B.x+=B.vx; B.y+=B.vy;

 if(B.x<B.r||B.x>c.width-B.r) B.vx*=-1;
 if(B.y<B.r){B.y=B.r;B.vy=Math.abs(B.vy);}

 if(B.x+B.r>N()-6 && B.x-B.r<N()+6 && B.y+B.r>G()-120){
   B.vx*=-1;
 }

 collide(P); collide(A);

 if(B.y+B.r>G()){
   if(B.x<N()) scorePoint("A");
   else scorePoint("P");
 }
}

function drawBlob(p,col){
 x.fillStyle=col;
 x.beginPath();
 x.arc(p.x,p.y,p.r,Math.PI,0);
 x.fill();
 x.fillStyle="#fff";
 x.beginPath();x.arc(p.x+15,p.y-22,8,0,6.28);x.fill();
 x.fillStyle="#000";
 x.beginPath();x.arc(p.x+17,p.y-22,3,0,6.28);x.fill();
}

function draw(){
 x.clearRect(0,0,c.width,c.height);

 if(state==="menu"){
  x.fillStyle="#fff";
  x.font="bold 52px Arial";
  x.textAlign="center";
  x.fillText("IRFANVOLLEY",c.width/2,120);

  ["Easy","Medium","Hard"].forEach((d,i)=>{
   x.fillStyle=d===difficulty?"#ffd700":"#ffffff";
   x.fillRect(c.width/2-120,180+i*80,240,50);
   x.fillStyle="#000";
   x.fillText(d,c.width/2,217+i*80);
  });

  x.fillStyle="#00cc66";
  x.fillRect(c.width/2-140,450,280,70);
  x.fillStyle="#fff";
  x.fillText("PLAY",c.width/2,500);
  return;
 }

 x.fillStyle="#d8c37a";x.fillRect(0,G(),c.width,100);
 x.fillStyle="#fff";x.fillRect(N()-6,G()-120,12,120);

 drawBlob(P,"blue");
 drawBlob(A,"red");

 x.fillStyle="yellow";
 x.beginPath();x.arc(B.x,B.y,B.r,0,6.28);x.fill();

 x.fillStyle="#000";
 x.font="32px Arial";
 x.fillText(`${sP} : ${sA}`,c.width/2-20,45);

 if(state==="gameover"){
  x.fillStyle="rgba(0,0,0,.7)";
  x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#fff";
  x.font="48px Arial";
  x.fillText(sP>sA?"YOU WIN":"BOT WINS",c.width/2,c.height/2);
 }

 x.globalAlpha=.3;
 x.fillStyle="#000";
 x.fillRect(20,c.height-140,90,90);
 x.fillRect(130,c.height-140,90,90);
 x.fillRect(c.width-120,c.height-140,90,90);
 x.globalAlpha=1;
 x.fillStyle="#fff";
 x.fillText("◀",50,c.height-80);
 x.fillText("▶",160,c.height-80);
 x.fillText("▲",c.width-90,c.height-80);
}

function loop(){update();draw();requestAnimationFrame(loop)} loop();

function handleTap(px,py){
 if(state==="menu"){
   if(py>180&&py<230) difficulty="Easy";
   if(py>260&&py<310) difficulty="Medium";
   if(py>340&&py<390) difficulty="Hard";
   if(py>450&&py<520){sP=0;sA=0;resetBall();state="play";}
 }
 if(state==="gameover"){sP=0;sA=0;resetBall();state="menu";}
}

addEventListener("touchstart",e=>{
 let t=e.touches[0];
 handleTap(t.clientX,t.clientY);
});
function tc(e){
 e.preventDefault();
 left=right=false;
 for(const t of e.touches){
  let X=t.clientX,Y=t.clientY;
  if(X<120&&Y>c.height-160) left=true;
  if(X>120&&X<240&&Y>c.height-160) right=true;
  if(X>c.width-140&&Y>c.height-160) jump=true;
 }
}
addEventListener("touchstart",tc,{passive:false});
addEventListener("touchmove",tc,{passive:false});
addEventListener("touchend",()=>{left=right=false;},{passive:false});
</script>
</body>
</html>
