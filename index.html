<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IrfanVolley Rebuild Beta</title>
<style>
html,body{margin:0;overflow:hidden;background:#87ceeb}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight;}rs();addEventListener('resize',rs);

let state='menu',difficulty='Easy';
const goal=15;

const p={x:0,y:0,r:48,vx:0,vy:0};
const ai={x:0,y:0,r:48,vx:0,vy:0};
const ball={x:0,y:0,r:18,vx:0,vy:0};

let ps=0,as=0;
let L=false,R=false,J=false;

const G=()=>c.height-90;
const NX=()=>c.width/2;

function reset(dir=1){
 p.x=c.width*.25;p.y=G();
 ai.x=c.width*.75;ai.y=G();
 p.vx=p.vy=ai.vx=ai.vy=0;
 ball.x=c.width/2;ball.y=140;
 ball.vx=5*dir;ball.vy=-3;
}
reset();

function score(side){
 if(side==='p') ps++; else as++;
 if((ps>=goal||as>=goal)&&Math.abs(ps-as)>=2){state='gameover';return;}
 reset(side==='p'?1:-1);
}

function hit(b){
 let dx=ball.x-b.x,dy=ball.y-b.y;
 let d=Math.hypot(dx,dy)||1;
 let m=ball.r+b.r;
 if(d<m){
   let nx=dx/d,ny=dy/d;
   ball.x=b.x+nx*m;
   ball.y=b.y+ny*m;

   let impact=(ball.vx-b.vx)*nx+(ball.vy-b.vy)*ny;
   if(impact<0){
      ball.vx-=2*impact*nx;
      ball.vy-=2*impact*ny;
   }
 }
}

function update(){
 if(state!=='play') return;

 if(L)p.vx=-7;
 else if(R)p.vx=7;
 else p.vx*=0.82;

 if(J&&p.y>=G()-1){p.vy=-13;J=false;}

 p.vy+=0.55;p.x+=p.vx;p.y+=p.vy;
 if(p.y>G()){p.y=G();p.vy=0;}
 p.x=Math.max(p.r,Math.min(NX()-30-p.r,p.x));

 let sp={Easy:2,Medium:3.5,Hard:5.5}[difficulty];
 let reaction={Easy:120,Medium:50,Hard:0}[difficulty];

 let target=ball.x;
 if(difficulty==="Easy") target-=120;
 if(difficulty==="Medium") target-=50;

 if(target>ai.x+reaction) ai.vx=sp;
 else if(target<ai.x-reaction) ai.vx=-sp;
 else ai.vx*=0.8;

 if(ball.y<ai.y-80 && ai.y>=G()-1){
    let chance={Easy:.35,Medium:.7,Hard:.95}[difficulty];
    if(Math.random()<chance) ai.vy=-12;
 }

 ai.vy+=0.55; ai.x+=ai.vx; ai.y+=ai.vy;
 if(ai.y>G()){ai.y=G();ai.vy=0;}
 ai.x=Math.max(NX()+30+ai.r,Math.min(c.width-ai.r,ai.x));

 ball.vy+=0.32;
 ball.x+=ball.vx;
 ball.y+=ball.vy;

 if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
 if(ball.x>c.width-ball.r){ball.x=c.width-ball.r;ball.vx=-Math.abs(ball.vx);}
 if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}

 // new anti-stick net
 let nx=NX();
 let netTop=G()-140;

 // side collision
 if(ball.y>netTop && ball.y<G()+10){
   if(ball.x+ball.r>nx-8 && ball.x<nx){
      ball.x=nx-ball.r-10;
      ball.vx=-Math.abs(ball.vx)-0.5;
   }
   if(ball.x-ball.r<nx+8 && ball.x>nx){
      ball.x=nx+ball.r+10;
      ball.vx=Math.abs(ball.vx)+0.5;
   }
 }

 // top cap collision
 let dx=ball.x-nx;
 let dy=ball.y-netTop;
 let d=Math.hypot(dx,dy);
 if(d<ball.r+10){
    let nxv=dx/(d||1), nyv=dy/(d||1);
    ball.x=nx+nxv*(ball.r+10);
    ball.y=netTop+nyv*(ball.r+10);
    ball.vx+=nxv*2;
    ball.vy+=nyv*2;
 }

 hit(p); hit(ai);

 if(ball.y+ball.r>G()){
   if(ball.x<NX()) score('a');
   else score('p');
 }
}

function blob(b,col){
 x.fillStyle="rgba(0,0,0,.15)";
 x.beginPath();x.ellipse(b.x,b.y+8,b.r,12,0,0,7);x.fill();

 x.fillStyle=col;
 x.beginPath();x.arc(b.x,b.y,b.r,Math.PI,0);x.fill();

 let eye=ball.x>b.x?12:-4;
 x.fillStyle="#fff";
 x.beginPath();x.arc(b.x+eye,b.y-22,9,0,7);x.fill();

 x.fillStyle="#000";
 x.beginPath();x.arc(b.x+eye+3,b.y-22,4,0,7);x.fill();
}

function btn(xp,yp,w,h,t,a){
 x.fillStyle=a?"#ffd54f":"#fff";
 x.fillRect(xp,yp,w,h);
 x.strokeRect(xp,yp,w,h);
 x.fillStyle="#000";
 x.font="24px Arial";
 x.textAlign="center";
 x.fillText(t,xp+w/2,yp+33);
}

function draw(){
 x.clearRect(0,0,c.width,c.height);

 if(state==='menu'){
   x.fillStyle="#fff";
   x.font="bold 42px Arial";
   x.textAlign="center";
   x.fillText("IRFANVOLLEY BETA",c.width/2,90);

   btn(c.width/2-100,140,200,50,"Easy",difficulty==="Easy");
   btn(c.width/2-100,210,200,50,"Medium",difficulty==="Medium");
   btn(c.width/2-100,280,200,50,"Hard",difficulty==="Hard");

   x.fillStyle="#00c853";
   x.fillRect(c.width/2-130,370,260,70);
   x.fillStyle="#fff";
   x.font="36px Arial";
   x.fillText("PLAY",c.width/2,418);
   return;
 }

 x.fillStyle="#d9c27a";
 x.fillRect(0,G(),c.width,100);

 x.fillStyle="#fff";
 x.fillRect(NX()-8,G()-140,16,140);
 x.beginPath();
 x.arc(NX(),G()-140,10,0,7);
 x.fill();

 blob(p,"#1565c0");
 blob(ai,"#d32f2f");

 x.fillStyle="#ffeb3b";
 x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();

 x.fillStyle="#000";
 x.font="32px Arial";
 x.textAlign="center";
 x.fillText(ps+" : "+as,c.width/2,40);

 // larger controls
 x.globalAlpha=.35;
 x.fillStyle="#000";
 x.fillRect(20,c.height-150,110,110);
 x.fillRect(150,c.height-150,110,110);
 x.fillRect(c.width-130,c.height-150,110,110);
 x.globalAlpha=1;

 x.fillStyle="#fff";
 x.fillText("◀",75,c.height-85);
 x.fillText("▶",205,c.height-85);
 x.fillText("▲",c.width-75,c.height-85);

 if(state==='gameover'){
   x.fillStyle="rgba(0,0,0,.7)";
   x.fillRect(0,0,c.width,c.height);
   x.fillStyle="#fff";
   x.font="50px Arial";
   x.fillText(ps>as?"YOU WIN":"BOT WINS",c.width/2,c.height/2);
 }
}

function loop(){update();draw();requestAnimationFrame(loop)} loop();

function tap(xp,yp){
 if(state==='menu'){
   if(yp>140&&yp<190)difficulty='Easy';
   if(yp>210&&yp<260)difficulty='Medium';
   if(yp>280&&yp<330)difficulty='Hard';
   if(yp>370&&yp<440){ps=0;as=0;reset();state='play';}
 }
 if(state==='gameover'){state='menu';}
}

function touch(e){
 e.preventDefault();
 let ts=e.touches;
 L=R=false;

 for(let t of ts){
   let X=t.clientX,Y=t.clientY;

   if(state==='menu'){tap(X,Y);continue;}

   if(X<140&&Y>c.height-170)L=true;
   if(X>140&&X<280&&Y>c.height-170)R=true;
   if(X>c.width-150&&Y>c.height-170)J=true;
 }
}

addEventListener('touchstart',touch,{passive:false});
addEventListener('touchmove',touch,{passive:false});
addEventListener('touchend',()=>{L=R=false;},{passive:false});
addEventListener('click',e=>tap(e.clientX,e.clientY));

</script>
</body>
</html>
