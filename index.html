<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IrfanVolley Rebuild Alpha</title>
<style>
html,body{margin:0;overflow:hidden;background:#7ec8ff;font-family:Arial}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight;} resize(); addEventListener("resize",resize);

let state="menu";
let difficulty="Easy";

const ground=()=>c.height-90;
const netX=()=>c.width/2;

const player={x:200,y:0,r:50,vx:0,vy:0};
const bot={x:800,y:0,r:50,vx:0,vy:0};
const ball={x:500,y:150,r:20,vx:4,vy:-2};

let scoreP=0,scoreB=0;
let left=false,right=false,jump=false;

function reset(side=1){
 player.x=c.width*0.25; player.y=ground();
 bot.x=c.width*0.75; bot.y=ground();
 player.vx=player.vy=bot.vx=bot.vy=0;
 ball.x=c.width/2; ball.y=150;
 ball.vx=5*side; ball.vy=-3;
}

function blobHit(blob){
 let dx=ball.x-blob.x;
 let dy=ball.y-blob.y;
 let d=Math.hypot(dx,dy);
 let min=ball.r+blob.r;
 if(d<min){
   let nx=dx/(d||1), ny=dy/(d||1);
   ball.x=blob.x+nx*min;
   ball.y=blob.y+ny*min;

   let rel=(ball.vx-blob.vx)*nx+(ball.vy-blob.vy)*ny;
   if(rel<0){
      ball.vx-=1.8*rel*nx;
      ball.vy-=1.8*rel*ny;
   }
 }
}

function point(side){
 if(side==="player") scoreP++; else scoreB++;
 reset(side==="player"?1:-1);
}

function update(){
 if(state!=="play") return;

 // player
 if(left) player.vx=-7;
 else if(right) player.vx=7;
 else player.vx*=0.8;

 if(jump && player.y>=ground()-1){
   player.vy=-13;
   jump=false;
 }

 player.vy+=0.55;
 player.x+=player.vx;
 player.y+=player.vy;

 if(player.y>ground()){player.y=ground();player.vy=0;}
 player.x=Math.max(player.r,Math.min(netX()-25-player.r,player.x));

 // bot
 let speed={Easy:2.5,Medium:4,Hard:6}[difficulty];
 let target=ball.x;

 if(difficulty==="Easy") target=ball.x-80;
 if(difficulty==="Medium") target=ball.x-30;

 if(target>bot.x+10) bot.vx=speed;
 else if(target<bot.x-10) bot.vx=-speed;
 else bot.vx*=0.8;

 if(ball.y<bot.y-70 && bot.y>=ground()-1){
   let chance={Easy:0.55,Medium:0.8,Hard:0.98}[difficulty];
   if(Math.random()<chance) bot.vy=-12;
 }

 bot.vy+=0.55;
 bot.x+=bot.vx;
 bot.y+=bot.vy;

 if(bot.y>ground()){bot.y=ground();bot.vy=0;}
 bot.x=Math.max(netX()+25+bot.r,Math.min(c.width-bot.r,bot.x));

 // ball
 ball.vy+=0.35;
 ball.x+=ball.vx;
 ball.y+=ball.vy;

 if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-0.9;}
 if(ball.x>c.width-ball.r){ball.x=c.width-ball.r;ball.vx*=-0.9;}
 if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}

 // net collision
 let nx=netX();
 if(ball.y+ball.r>ground()-140 &&
    ball.x+ball.r>nx-8 &&
    ball.x-ball.r<nx+8){
      if(ball.x<nx) ball.x=nx-ball.r-8;
      else ball.x=nx+ball.r+8;
      ball.vx*=-0.85;
 }

 blobHit(player);
 blobHit(bot);

 if(ball.y+ball.r>ground()){
   if(ball.x<netX()) point("bot");
   else point("player");
 }

 if(scoreP>=15 || scoreB>=15){
   if(Math.abs(scoreP-scoreB)>=2){
      state="gameover";
   }
 }
}

function drawBlob(b,color){
 ctx.fillStyle="rgba(0,0,0,.2)";
 ctx.beginPath();
 ctx.ellipse(b.x,b.y+8,b.r,12,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(b.x,b.y,b.r,Math.PI,0);
 ctx.fill();

 let ex=ball.x>b.x?15:-5;
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(b.x+ex,b.y-25,10,0,6.28);
 ctx.fill();

 ctx.fillStyle="black";
 ctx.beginPath();
 ctx.arc(b.x+ex+3,b.y-25,4,0,6.28);
 ctx.fill();
}

function drawButton(x,y,w,h,text,active=false){
 ctx.fillStyle=active?"#ffd54f":"#ffffff";
 ctx.fillRect(x,y,w,h);
 ctx.strokeRect(x,y,w,h);
 ctx.fillStyle="#000";
 ctx.font="24px Arial";
 ctx.textAlign="center";
 ctx.fillText(text,x+w/2,y+34);
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 if(state==="menu"){
   ctx.fillStyle="#fff";
   ctx.textAlign="center";
   ctx.font="bold 48px Arial";
   ctx.fillText("IRFANVOLLEY",c.width/2,100);

   drawButton(c.width/2-100,150,200,50,"Easy",difficulty==="Easy");
   drawButton(c.width/2-100,220,200,50,"Medium",difficulty==="Medium");
   drawButton(c.width/2-100,290,200,50,"Hard",difficulty==="Hard");

   ctx.fillStyle="#00c853";
   ctx.fillRect(c.width/2-130,390,260,70);
   ctx.fillStyle="#fff";
   ctx.font="bold 36px Arial";
   ctx.fillText("PLAY",c.width/2,438);
   return;
 }

 ctx.fillStyle="#d8c37a";
 ctx.fillRect(0,ground(),c.width,100);

 ctx.fillStyle="#fff";
 ctx.fillRect(netX()-8,ground()-140,16,140);

 drawBlob(player,"#1565c0");
 drawBlob(bot,"#d32f2f");

 ctx.fillStyle="#ffeb3b";
 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.r,0,6.28);
 ctx.fill();

 ctx.fillStyle="#000";
 ctx.font="30px Arial";
 ctx.fillText(scoreP+" : "+scoreB,c.width/2,40);

 // controls
 ctx.globalAlpha=.35;
 ctx.fillStyle="#000";
 ctx.fillRect(20,c.height-120,80,80);
 ctx.fillRect(120,c.height-120,80,80);
 ctx.fillRect(c.width-100,c.height-120,80,80);
 ctx.globalAlpha=1;

 ctx.fillStyle="#fff";
 ctx.fillText("◀",60,c.height-70);
 ctx.fillText("▶",160,c.height-70);
 ctx.fillText("▲",c.width-60,c.height-70);

 if(state==="gameover"){
      ctx.fillStyle="rgba(0,0,0,.75)";
      ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle="#fff";
      ctx.font="50px Arial";
      ctx.fillText(scoreP>scoreB?"YOU WIN":"BOT WINS",c.width/2,c.height/2);
      ctx.font="24px Arial";
      ctx.fillText("Tap anywhere",c.width/2,c.height/2+50);
   }
}

function loop(){update();draw();requestAnimationFrame(loop)} loop();

function menuTap(x,y){
 if(y>150&&y<200) difficulty="Easy";
 if(y>220&&y<270) difficulty="Medium";
 if(y>290&&y<340) difficulty="Hard";
 if(y>390&&y<460){
   scoreP=0; scoreB=0;
   reset();
   state="play";
 }
}

function touchControls(e){
 e.preventDefault();
 left=right=false;
 for(let t of e.touches){
   let x=t.clientX,y=t.clientY;
   if(state==="menu"){menuTap(x,y); continue;}
   if(x<110&&y>c.height-140) left=true;
   if(x>110&&x<220&&y>c.height-140) right=true;
   if(x>c.width-120&&y>c.height-140) jump=true;
 }
}

addEventListener("touchstart",touchControls,{passive:false});
addEventListener("touchmove",touchControls,{passive:false});
addEventListener("touchend",()=>{left=right=false;},{passive:false});

addEventListener("click",e=>{
 if(state==="menu") menuTap(e.clientX,e.clientY);
 if(state==="gameover"){state="menu";}
});

reset();
</script>
</body>
</html>
