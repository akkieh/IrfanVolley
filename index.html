<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IrfanVolley Delta 1</title>
<style>
html,body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}resize();addEventListener('resize',resize);

const G=()=>c.height-80, NX=()=>c.width/2;
let state="menu", difficulty="Easy";
let scoreP=0, scoreAI=0;

const p={x:0,y:0,r:45,vx:0,vy:0};
const ai={x:0,y:0,r:45,vx:0,vy:0};
const ball={x:0,y:0,r:18,vx:0,vy:0};

let dragActive=false,startX=0,startY=0,dragDX=0;

function reset(dir=1){
 p.x=c.width*0.25; p.y=G();
 ai.x=c.width*0.75; ai.y=G();
 p.vx=p.vy=ai.vx=ai.vy=0;
 ball.x=c.width/2; ball.y=140;
 ball.vx=5*dir; ball.vy=-4;
}
reset();

function point(side){
 if(side==="p") scoreP++; else scoreAI++;
 if((scoreP>=15||scoreAI>=15)&&Math.abs(scoreP-scoreAI)>=2){
   state="gameover"; return;
 }
 reset(side==="p"?1:-1);
}

function collide(blob){
 let dx=ball.x-blob.x, dy=ball.y-blob.y;
 let d=Math.hypot(dx,dy)||1;
 let min=ball.r+blob.r;
 if(d<min){
   let nx=dx/d, ny=dy/d;
   ball.x=blob.x+nx*min;
   ball.y=blob.y+ny*min;
   let impact=(ball.vx-blob.vx)*nx+(ball.vy-blob.vy)*ny;
   if(impact<0){
      ball.vx-=2*impact*nx;
      ball.vy-=2*impact*ny;
   }
 }
}

function update(){
 if(state!=="play") return;

 p.vx=Math.max(-8,Math.min(8,dragDX*0.12));
 p.vy+=0.55;
 p.x+=p.vx; p.y+=p.vy;
 if(p.y>G()){p.y=G();p.vy=0;}
 p.x=Math.max(p.r,Math.min(NX()-25-p.r,p.x));

 let predict=ball.x+ball.vx*15;
 const cfg={Easy:[2,-120,.35],Medium:[4,-40,.7],Hard:[6,0,.95]}[difficulty];
 if(predict+cfg[1]>ai.x+10) ai.vx=cfg[0];
 else if(predict+cfg[1]<ai.x-10) ai.vx=-cfg[0];
 else ai.vx*=0.8;

 if(ball.y<ai.y-70 && ai.y>=G()-1 && Math.random()<cfg[2]) ai.vy=-12;

 ai.vy+=0.55; ai.x+=ai.vx; ai.y+=ai.vy;
 if(ai.y>G()){ai.y=G();ai.vy=0;}
 ai.x=Math.max(NX()+25+ai.r,Math.min(c.width-ai.r,ai.x));

 ball.vy+=0.33;
 ball.x+=ball.vx; ball.y+=ball.vy;

 if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
 if(ball.x>c.width-ball.r){ball.x=c.width-ball.r;ball.vx=-Math.abs(ball.vx);}
 if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}

 let nx=NX(), top=G()-130;

 if(ball.y>top){
   if(ball.x<nx && ball.x+ball.r>nx-8){
      ball.x=nx-ball.r-12; ball.vx=-Math.abs(ball.vx)-1;
   }
   if(ball.x>nx && ball.x-ball.r<nx+8){
      ball.x=nx+ball.r+12; ball.vx=Math.abs(ball.vx)+1;
   }
 }

 collide(p); collide(ai);

 if(ball.y+ball.r>G()){
   if(ball.x<nx) point("a"); else point("p");
 }
}

function drawBlob(b,col){
 ctx.fillStyle="rgba(0,0,0,.15)";
 ctx.beginPath();ctx.ellipse(b.x,b.y+8,b.r,10,0,0,7);ctx.fill();
 ctx.fillStyle=col;
 ctx.beginPath();ctx.arc(b.x,b.y,b.r,Math.PI,0);ctx.fill();
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 if(state==="menu"){
   ctx.fillStyle="white";
   ctx.textAlign="center";
   ctx.font="bold 42px Arial";
   ctx.fillText("IRFANVOLLEY DELTA 1",c.width/2,90);

   ["Easy","Medium","Hard"].forEach((d,i)=>{
     ctx.fillStyle=d===difficulty?"#ffd54f":"white";
     ctx.fillRect(c.width/2-110,150+i*70,220,50);
     ctx.strokeRect(c.width/2-110,150+i*70,220,50);
     ctx.fillStyle="black";
     ctx.fillText(d,c.width/2,185+i*70);
   });

   ctx.fillStyle="#00c853";
   ctx.fillRect(c.width/2-120,390,240,70);
   ctx.fillStyle="white";
   ctx.fillText("PLAY",c.width/2,440);
   return;
 }

 ctx.fillStyle="#d8c37a";
 ctx.fillRect(0,G(),c.width,100);

 ctx.fillStyle="white";
 ctx.fillRect(NX()-8,G()-130,16,130);

 drawBlob(p,"#1565c0");
 drawBlob(ai,"#d32f2f");

 ctx.fillStyle="yellow";
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();

 ctx.fillStyle="black";
 ctx.font="28px Arial";
 ctx.textAlign="center";
 ctx.fillText(scoreP+" : "+scoreAI,c.width/2,40);

 if(state==="gameover"){
   ctx.fillStyle="rgba(0,0,0,.7)";
   ctx.fillRect(0,0,c.width,c.height);
   ctx.fillStyle="white";
   ctx.font="44px Arial";
   ctx.fillText(scoreP>scoreAI?"YOU WIN":"BOT WINS",c.width/2,c.height/2);
   ctx.font="22px Arial";
   ctx.fillText("Tap to return",c.width/2,c.height/2+40);
 }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();

c.addEventListener("touchstart",e=>{
 let t=e.touches[0];
 if(state==="menu"){
   let y=t.clientY;
   if(y>150&&y<200) difficulty="Easy";
   if(y>220&&y<270) difficulty="Medium";
   if(y>290&&y<340) difficulty="Hard";
   if(y>390&&y<470){scoreP=0;scoreAI=0;reset();state="play";}
   return;
 }
 dragActive=true;
 startX=t.clientX; startY=t.clientY;
},{passive:false});

c.addEventListener("touchmove",e=>{
 if(!dragActive||state!=="play") return;
 let t=e.touches[0];
 dragDX=t.clientX-startX;

 let dy=t.clientY-startY;
 if(dy<-60 && p.y>=G()-1){
   p.vy=-13;
   startY=t.clientY;
 }
 e.preventDefault();
},{passive:false});

c.addEventListener("touchend",()=>{
 dragActive=false;
 dragDX=0;
});

c.addEventListener("click",()=>{
 if(state==="gameover") state="menu";
});
</script>
</body>
</html>
